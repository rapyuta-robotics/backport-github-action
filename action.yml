name: 'Backport Action'
description: 'Backport merged pull requests to other branches via labels'
inputs:
  github_token:
    description: The access token that will be used to create the backport pull requests and perform other operations
    required: true
  auto_backport_label_prefix:
    description: Backport a pull request to specific branches based on the labels applied
    required: false
  repo_fork_owner:
    description: The owner of the repo where the backport branch will be pushed to. Defaults to the current repo
    required: false
  add_original_reviewers:
    description: Boolean, if set to true the reviewers of the original PR will also be added to the backport PRs
    required: false
    default: false
  auto_merge:
    description: Enable GitHub auto-merge on backport PRs that applied cleanly. Branch protection still decides when they merge (reviews, required checks). Never enabled in draft-pr conflict mode. Requires the repo setting "Allow auto-merge"
    required: false
    default: true
  auto_merge_method:
    description: Merge method for auto-merge (merge, squash or rebase)
    required: false
    default: squash
  fix_owner:
    description: GitHub login that owns the fix (e.g. the ADO assignee of its work item). Review is requested from them on clean backport PRs, and conflicts are assigned to them. Empty means the original PR author, or its merger if the author is a bot. Bots are never used
    required: false
    default: ''
  escalation:
    description: GitHub login that takes over a conflict after the backport SLA. Only named in the conflict comment (not pinged, not assigned)
    required: false
    default: ''
  conflict_mode:
    description: 'What to do when a pick conflicts. "comment" (default) opens no PR; it comments the exact commands on the original PR, assigns the fix owner and adds the label <conflict_label_prefix><target branch>. "draft-pr" keeps the old behaviour of the repo config (commitConflicts) and posts the library failure comment'
    required: false
    default: comment
  conflict_label_prefix:
    description: Prefix of the label added to the original PR on a conflict; the target branch is appended
    required: false
    default: backport-conflict-
  provenance_trailer:
    description: 'Append "Backport-of: #N" and "(cherry picked from commit <sha>)" as the last paragraph of each backport PR body, so a squash merge that uses the PR body keeps them'
    required: false
    default: true
runs:
  using: 'node20'
  main: 'dist/index.js'
branding:
  icon: git-branch
  color: green
